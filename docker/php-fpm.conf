[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 60
pm.start_servers = 15
pm.min_spare_servers = 10
pm.max_spare_servers = 25
; recycle les workers pour éviter les fuites mémoire lentes
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = no

; Page de statut (utile pour ajuster max_children)
pm.status_path = /fpm-status
