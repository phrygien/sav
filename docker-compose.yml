version: "3.9"

networks:
    traefik-public:
        external: true
    cosm-ia-net:
        external: true

services:
    cosm-ia-app:
        build: .
        container_name: cosmia-app
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - cosm-ia-storage:/var/www/html/storage
        networks:
            - cosm-ia-net
            - traefik-public
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.cosm-ia.rule=Host(`cosmia.cosma-parfumeries.com`)
            - traefik.http.routers.cosm-ia.entrypoints=websecure
            - traefik.http.routers.cosm-ia.tls.certresolver=letsencrypt
            - traefik.http.services.cosm-ia.loadbalancer.server.port=80

volumes:
    cosm-ia-storage:
