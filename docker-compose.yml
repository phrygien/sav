networks:
    traefik-public:
        external: true
    cosm-ia-net:
        external: true

services:
    cosm-ia-app:
        build: .
        container_name: cosmia-app
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - cosm-ia-storage:/var/www/html/storage
        networks:
            - cosm-ia-net
            - traefik-public

        # ── Ressources ──────────────────────────
        mem_limit: 6g
        memswap_limit: 6g        # pas de swap : OOM propre plutôt que lenteur
        mem_reservation: 5g
        cpus: 4.0                # adapte au nombre de cœurs de ton serveur
        pids_limit: 512          # 60 workers + nginx + supervisor, avec marge
        shm_size: 256m
        ulimits:
            nofile:
                soft: 65536
                hard: 65536

        # ── Healthcheck ─────────────────────────
        healthcheck:
            test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

        # ── Logs (évite de saturer le disque) ───
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-public
            - traefik.http.routers.cosm-ia.rule=Host(`cosmia.cosma-parfumeries.com`)
            - traefik.http.routers.cosm-ia.entrypoints=websecure
            - traefik.http.routers.cosm-ia.tls.certresolver=letsencrypt
            - traefik.http.services.cosm-ia.loadbalancer.server.port=80

volumes:
    cosm-ia-storage:
